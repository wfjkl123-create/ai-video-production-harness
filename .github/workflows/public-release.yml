name: Public release verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run configure-template -- --write-env
      - run: npm run check
      - run: npm run doctor:source

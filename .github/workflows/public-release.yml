name: Public release verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: python -m pip install --disable-pip-version-check "numpy==2.0.2" "opencv-python==5.0.0.93"
      - run: npm run configure-template -- --write-env
      - run: npm run check
      - run: npm run doctor:source
